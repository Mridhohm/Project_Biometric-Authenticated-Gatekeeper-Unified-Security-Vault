[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#090D16"
secondaryBackgroundColor = "#111827"
textColor = "#F1F5F9"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
showErrorDetails = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
