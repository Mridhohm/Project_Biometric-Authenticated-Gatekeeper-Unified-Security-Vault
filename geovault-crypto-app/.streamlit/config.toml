[theme]
base = "dark"
primaryColor = "#FCEE0A"
backgroundColor = "#050506"
secondaryBackgroundColor = "#0D0A0C"
textColor = "#EFE8EA"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
showErrorDetails = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
