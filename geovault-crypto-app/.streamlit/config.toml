[theme]
base = "dark"
primaryColor = "#00F0FF"
backgroundColor = "#06070C"
secondaryBackgroundColor = "#0C0E17"
textColor = "#EDF4FC"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
showErrorDetails = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
